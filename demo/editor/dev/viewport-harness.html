<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewport harness</title>
<link rel="icon" href="data:,">
<!--
  Developer harness for demo/editor/viewport.js + editing.js.

  Open it through the demo server (embedded copy, or -web-dir demo while
  iterating on the editor):
       http://127.0.0.1:<port>/editor/dev/viewport-harness.html?id=<animation id>
  It reads only the server API: the skeleton from /api/models and one ready
  animation from /api/animations and /api/animations/<id>/{root,rotations,contacts}.

  Query parameters: id=<animation>, frame=<n>, seed=0 (no example constraints),
  edit=local|world (start in editing mode).
  window.__h exposes the viewport, editor, store and motion for scripted tests.
-->
<script type="importmap">
  { "imports": { "three": "/assets/three/three.module.min.js", "three/addons/": "/assets/three/" } }
</script>
<style>
  :root { color-scheme: dark; --bg: #080b0f; --panel: #10151b; --panel-2: #151c23; --line: #25313b; --text: #f3f6f4; --muted: #8b9aa5; --cyan: #3bd3d0; --cyan-2: #5ee6be; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; }
  #view { min-width: 0; min-height: 0; }
  aside { border-left: 1px solid var(--line); background: radial-gradient(circle at 18% 0, rgba(59, 211, 208, .1), transparent 22rem), var(--panel); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .eyebrow { font: 11px ui-monospace, Menlo, monospace; color: var(--cyan); text-transform: uppercase; letter-spacing: .12em; }
  section { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px; display: grid; gap: 7px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { border: 1px solid var(--line); background: #0b1015; color: var(--text); border-radius: 7px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--cyan); }
  button.primary { background: linear-gradient(135deg, var(--cyan), var(--cyan-2)); color: #051013; border: 0; font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  label { display: flex; gap: 6px; align-items: center; color: var(--text); }
  select, input[type=range] { accent-color: var(--cyan); }
  select { background: #0b1015; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  input[type=range] { flex: 1; min-width: 0; }
  .readout { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #log { font: 11px/1.45 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow-y: auto; }
  #error { color: #ffacac; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <div id="view"></div>
  <aside>
    <header>
      <div class="eyebrow">kimodo.cpp · editor dev</div>
      <h1>Viewport harness</h1>
      <div id="source" class="readout">Loading…</div>
      <div id="error"></div>
    </header>
    <section>
      <h2>Playback</h2>
      <div class="row"><button id="play">Play</button><button id="prev">◀</button><button id="next">▶</button><span id="frameText" class="readout"></span></div>
      <input id="frame" type="range" min="0" value="0" step="1">
    </section>
    <section>
      <h2>Editing</h2>
      <div class="row">
        <label>Gizmo space <select id="space"><option value="local">Local</option><option value="world">World</option></select></label>
        <button id="edit" class="primary">Enter Editing Mode</button>
      </div>
      <div class="row"><button id="undo" disabled>Undo Move</button><button id="reset" disabled>Reset Constraint</button><button id="snap">Snap to Constraint</button></div>
      <div class="row"><button id="modeT" title="W">Translate (W)</button><button id="modeR" title="E">Rotate (E)</button><button id="clearHeading">Clear heading</button></div>
      <div id="selection" class="readout">Nothing selected</div>
    </section>
    <section>
      <h2>Constraints at current frame</h2>
      <div class="row">
        <button data-add="fullbody">Full-Body</button><button data-add="root2d">2D Root</button>
        <button data-add="left-hand">L Hand</button><button data-add="right-hand">R Hand</button>
        <button data-add="left-foot">L Foot</button><button data-add="right-foot">R Foot</button>
      </div>
      <div class="row"><label><input id="smooth" type="checkbox"> Make Smooth Path</label><button id="clear">Clear All</button></div>
      <div id="counts" class="readout"></div>
    </section>
    <section>
      <h2>Visualize</h2>
      <div class="row">
        <label><input type="checkbox" data-opt="showMesh" checked> Mesh</label>
        <label><input type="checkbox" data-opt="showSkeleton"> Skeleton</label>
        <label><input type="checkbox" data-opt="showContacts"> Contacts</label>
        <label><input type="checkbox" data-opt="showLabels" checked> Labels</label>
        <label><input type="checkbox" data-opt="showStartDirection" checked> Start direction</label>
        <label><input type="checkbox" data-opt="onlyCurrent"> Only current</label>
        <label><input type="checkbox" data-opt="follow"> Follow</label>
      </div>
      <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1"></label>
      <div class="row"><button id="camera">Reset camera</button></div>
    </section>
    <section>
      <h2>Events</h2>
      <div id="log"></div>
    </section>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import { Skeleton } from '../skeleton.js';
import { Motion } from '../motion.js';
import { ConstraintStore, TRACKS } from '../constraints.js';
import { Viewport } from '../viewport.js';
import { Editor } from '../editing.js';

// soma30 /api/models entry (same data as demo/skeletons_extra.go and tests/fixtures/soma30.mjs);
// kept for reference, the harness uses the server's entry.
const SOMA30_MODEL = {
  id: 'soma-rp-v1.1',
  skeleton_key: 'soma30',
  names: ['Hips', 'Spine1', 'Spine2', 'Chest', 'Neck1', 'Neck2', 'Head', 'Jaw', 'LeftEye', 'RightEye',
    'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand', 'LeftHandThumbEnd', 'LeftHandMiddleEnd',
    'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand', 'RightHandThumbEnd', 'RightHandMiddleEnd',
    'LeftLeg', 'LeftShin', 'LeftFoot', 'LeftToeBase', 'RightLeg', 'RightShin', 'RightFoot', 'RightToeBase'],
  parents: [-1, 0, 1, 2, 3, 4, 5, 6, 6, 6, 3, 10, 11, 12, 13, 13, 3, 16, 17, 18, 19, 19, 0, 22, 23, 24, 0, 26, 27, 28],
  offsets: [[0, 0, 0], [-0.00013727, 0.0500376256, -0.00053726669], [-1.86574103e-9, 0.0712530139, -0.000298248546],
    [-5.75188398e-9, 0.0755006305, -0.00815970992], [-0.00181676517, 0.263112953, -0.00553348292],
    [-2.85102231e-8, 0.0770939664, 0.0230258546], [-4.5975437e-8, 0.0612891595, 0.0195370861],
    [2.63687901e-5, 0.0047559225, 0.0309494062], [0.0320638079, 0.0538020513, 0.0758688308],
    [-0.0322244017, 0.05361869, 0.0755823359], [0.0162165175, 0.232371641, 0.0511341324],
    [0.149198457, 2.19397873e-8, -0.0550232576], [0.287393078, 2.50268389e-9, -2.58787737e-5],
    [0.270939812, -7.06625108e-9, 2.60897248e-5], [0.122686267, -0.0322017573, 0.0483306876],
    [0.190119595, -0.00312878387, -0.000339570373], [-0.0138011824, 0.231803086, 0.0521415786],
    [-0.150371962, 1.17387901e-7, -0.0554560437], [-0.287366393, 1.87628082e-8, -2.59709359e-5],
    [-0.271336198, -1.16767401e-9, 2.61269368e-5], [-0.122642483, -0.0321145448, 0.0480403904],
    [-0.190005945, -0.00306615542, -0.0003157343], [0.10043214, -0.0843452671, 0.0259565473],
    [-1e-8, -0.432217537, -0.00802912805], [1e-8, -0.421550959, -0.0348152298],
    [0, -0.0505947206, 0.132315294], [-0.10047278, -0.0829525995, 0.0262031695],
    [1e-8, -0.433622059, -0.00805555828], [2e-8, -0.421173943, -0.0347839785],
    [-3.42907669e-9, -0.0507960932, 0.132841956]],
  root_index: 0,
  hips: [26, 22],
  chains: {
    LeftHand: ['LeftHand', 'LeftHandMiddleEnd'], RightHand: ['RightHand', 'RightHandMiddleEnd'],
    LeftFoot: ['LeftFoot', 'LeftToeBase'], RightFoot: ['RightFoot', 'RightToeBase'],
  },
};
const FPS = 30;

const $ = (sel) => document.querySelector(sel);
const params = new URLSearchParams(location.search);
const h = (window.__h = { THREE, ready: false, events: [], errors: [], SOMA30_MODEL });

function log(text) {
  h.events.push(text);
  const el = $('#log');
  el.textContent = h.events.slice(-40).join('\n');
  el.scrollTop = el.scrollHeight;
}

async function f32(url, optional = false) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) {
    if (optional) return null;
    throw new Error(`${url}: HTTP ${r.status}`);
  }
  return new Float32Array(await r.arrayBuffer());
}

/** Loads {model, id, label, root, rot, contacts} through the demo server API (nothing else is read). */
async function loadSource() {
  const [anims, models] = await Promise.all([fetch('/api/animations').then((r) => r.json()), fetch('/api/models').then((r) => r.json())]);
  const ready = anims.filter((a) => a.status === 'ready');
  const a = ready.find((x) => x.id === params.get('id')) ?? ready.find((x) => String(x.model).startsWith('soma')) ?? ready[0];
  if (!a) throw new Error('no ready animation on this server');
  const model = models.find((m) => m.id === a.model);
  if (!model) throw new Error(`model ${a.model} not in /api/models`);
  const base = `/api/animations/${encodeURIComponent(a.id)}/`;
  const [root, rot, contacts] = await Promise.all([f32(`${base}root.f32`), f32(`${base}rotations.f32`), f32(`${base}contacts.f32`, true)]);
  return { model, id: a.id, label: a.prompt || a.id, root, rot, contacts };
}

/**
 * Old outputs have no foot_contacts.f32: derive stand-in contacts (foot joint
 * below 7 cm and slower than 0.5 m/s) so the contact display can be checked.
 */
function syntheticContacts(motion) {
  const sk = motion.skeleton;
  const joints = [sk.chains.LeftFoot[0], sk.chains.LeftFoot.at(-1), sk.chains.RightFoot[0], sk.chains.RightFoot.at(-1)];
  const out = new Float32Array(motion.frames * 4);
  for (let f = 0; f < motion.frames; f++) {
    const P = motion.pose(f).positions, Q = motion.pose(Math.min(f + 1, motion.frames - 1)).positions;
    joints.forEach((j, k) => {
      const speed = Math.hypot(Q[3 * j] - P[3 * j], Q[3 * j + 1] - P[3 * j + 1], Q[3 * j + 2] - P[3 * j + 2]) * FPS;
      out[f * 4 + k] = P[3 * j + 1] < 0.07 && speed < 0.5 ? 1 : 0;
    });
  }
  return out;
}

try {
  const src = await loadSource();
  const skeleton = new Skeleton(src.model);
  let motion = Motion.fromBuffers(skeleton, src.root, src.rot, src.contacts);
  if (!motion.contacts) motion = new Motion(skeleton, motion.frames, motion.local, motion.root, { contacts: syntheticContacts(motion) });
  const numFrames = motion.frames;
  $('#source').textContent = `${src.id} · ${numFrames} frames · ${src.label}${src.contacts ? '' : ' · synthetic contacts'}`;

  const store = new ConstraintStore(skeleton);
  store.setNumFrames(numFrames, motion);
  if (params.get('seed') !== '0') {
    // Example constraints covering every overlay kind.
    store.addKeyframe('fullbody', 30, motion);
    store.addKeyframe('left-hand', 60, motion);
    store.addKeyframe('right-foot', 60, motion);
    store.addKeyframe('root2d', 90, motion);
    store.setRootHeading(90, Math.PI / 4);
    store.addInterval('root2d', 100, 125, motion);
    store.addInterval('fullbody', 140, 143, motion);
  }

  const state = { frame: Math.max(0, Math.min(numFrames - 1, Number(params.get('frame') || 0))), playing: false, speed: 1 };
  const viewport = new Viewport($('#view'), skeleton);
  viewport.setMotion(motion);
  viewport.setConstraints(store, numFrames);
  viewport.setFrame(state.frame);
  const editor = new Editor(viewport, () => ({ motion, frame: state.frame, store, numFrames }));
  Object.assign(h, { viewport, editor, store, motion, skeleton, state, numFrames });

  function setFrame(f) {
    state.frame = Math.max(0, Math.min(numFrames - 1, Math.round(f)));
    viewport.setFrame(state.frame);
    editor.refresh();
    syncUI();
  }
  h.setFrame = setFrame;

  function syncUI() {
    $('#frame').max = numFrames - 1;
    $('#frame').value = state.frame;
    $('#frameText').textContent = `frame ${state.frame} / ${numFrames - 1}`;
    $('#play').textContent = state.playing ? 'Pause' : 'Play';
    $('#edit').textContent = editor.active ? 'Exit Editing Mode' : 'Enter Editing Mode';
    $('#space').disabled = editor.active;
    $('#undo').disabled = !editor.canUndo;
    $('#reset').disabled = !editor.active;
    const counts = TRACKS.map((t) => `${t}: ${store.frameCount(t)}`).join(' · ');
    $('#counts').textContent = `${counts}${store.hasConstraintAt(state.frame) ? ' · constraint here' : ''}`;
    $('#smooth').checked = store.smoothPath;
    const j = editor.selectedJoint;
    $('#selection').textContent = editor.headingSelected ? `2D Root waypoint @ ${state.frame} (heading ring)`
      : j >= 0 ? `Joint ${j} ${skeleton.names[j]} · ${j === skeleton.rootIndex ? editor.jointMode : 'rotate'} · ${editor.space}` : 'Nothing selected';
    const o = viewport.options;
    for (const el of document.querySelectorAll('[data-opt]')) el.checked = !!o[el.dataset.opt];
    $('#opacity').value = o.meshOpacity;
  }
  h.syncUI = syncUI;

  // editor events
  for (const type of ['change', 'dragstart', 'dragend', 'select', 'modechange']) {
    editor.addEventListener(type, (e) => {
      const d = e.detail || {};
      if (type !== 'change' || d.kind !== h.lastChangeKind) log(`${type} ${JSON.stringify(d)}`);
      if (type === 'change') h.lastChangeKind = d.kind;
      if (type === 'dragend') h.lastChangeKind = null;
      syncUI();
    });
  }
  store.addEventListener('change', (e) => { if (e.detail.reason !== 'writeThrough') log(`store ${e.detail.reason}`); syncUI(); });

  // controls
  $('#play').onclick = () => { state.playing = !state.playing; syncUI(); };
  $('#prev').onclick = () => setFrame(state.frame - 1);
  $('#next').onclick = () => setFrame(state.frame + 1);
  $('#frame').oninput = (e) => setFrame(Number(e.target.value));
  $('#edit').onclick = () => {
    if (editor.active) { editor.exit(); log('Exited editing mode'); }
    else { state.playing = false; editor.enter($('#space').value); log('Entered editing mode'); }
    syncUI();
  };
  $('#undo').onclick = () => editor.undoDrag();
  $('#reset').onclick = () => editor.resetPose();
  $('#snap').onclick = () => log(`snap -> ${editor.snapToConstraint()}`);
  $('#modeT').onclick = () => editor.setJointMode('translate');
  $('#modeR').onclick = () => editor.setJointMode('rotate');
  $('#clearHeading').onclick = () => editor.clearRootHeading();
  for (const b of document.querySelectorAll('[data-add]')) {
    b.onclick = () => {
      const id = store.addKeyframe(b.dataset.add, state.frame, motion);
      if (store.smoothPath && b.dataset.add === 'root2d') store.applyDensePath(motion, numFrames);
      log(`add ${b.dataset.add} @ ${state.frame} -> ${id}`);
    };
  }
  $('#smooth').onchange = (e) => store.setSmoothPath(e.target.checked, motion, numFrames);
  $('#clear').onclick = () => store.clear();
  for (const el of document.querySelectorAll('[data-opt]')) el.onchange = () => viewport.setOptions({ [el.dataset.opt]: el.checked });
  $('#opacity').oninput = (e) => viewport.setOptions({ meshOpacity: Number(e.target.value) });
  $('#camera').onclick = () => viewport.resetCamera();
  window.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.code === 'Space') { state.playing = !state.playing; e.preventDefault(); syncUI(); }
    else if (e.key === 'ArrowLeft') setFrame(state.frame - 1);
    else if (e.key === 'ArrowRight') setFrame(state.frame + 1);
  });

  // render loop: playback advances at FPS * speed off requestAnimationFrame time
  let last = performance.now(), acc = 0;
  function tick(now) {
    if (state.playing && !editor.active) {
      acc += (now - last) / 1000 * FPS * state.speed;
      if (acc >= 1) { const n = Math.floor(acc); acc -= n; setFrame((state.frame + n) % numFrames); }
    } else acc = 0;
    last = now;
    viewport.render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  if (params.get('edit')) editor.enter(params.get('edit'));
  syncUI();
  h.ready = true;
} catch (err) {
  console.error(err);
  h.errors.push(String(err && err.stack || err));
  $('#error').textContent = String(err && err.message || err);
  h.ready = true;
}
</script>
</body>
</html>
